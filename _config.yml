title: Singelas Referências
tagline: Registro escrito de coisa ouvida, vista, lida ou pensada
author: Winicius B. Faquieri
email: wfaquieri@gmail.com
lang: pt-BR

# Domínio próprio. Este par tem que casar com o arquivo CNAME da raiz: se um
# mudar e o outro não, todo link e todo CSS do site quebram de uma vez.
url: "https://singelasreferencias.com.br"
baseurl: ""

permalink: /:year/:month/:title/

# Contador de visitas. Só o nome do site na conta do GoatCounter, sem o resto do
# endereço: se a conta é "singelas.goatcounter.com", aqui vai só "singelas".
# Vazio significa nenhum contador na página.
goatcounter: "singelas"

# Lista de e-mail. Só o nome de usuário na conta do Buttondown, sem o resto do
# endereço. Vazio significa nenhum formulário na página.
buttondown: "singelasreferencias"

markdown: kramdown
kramdown:
  footnote_backlink: "↩"
  smart_quotes: ["apos", "apos", "ldquo", "rdquo"]

plugins:
  - jekyll-feed
  - jekyll-sitemap

feed:
  path: feed.xml
  # O feed leva o resumo e o link, não o texto inteiro. Fora da página, duas
  # coisas quebram: as notas de rodapé apontam para âncoras que só existem aqui,
  # e a caixa de comentário perde a borda que a separa da citação, de modo que o
  # leitor deixa de saber quem está falando.
  excerpt_only: true

meses:
  - janeiro
  - fevereiro
  - março
  - abril
  - maio
  - junho
  - julho
  - agosto
  - setembro
  - outubro
  - novembro
  - dezembro

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
