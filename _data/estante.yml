# A estante. Cada item vira uma lombada em /estante/, e a ordem daqui é a ordem
# em que os livros aparecem na prateleira — arrumados por autor, como se arruma
# estante de verdade. Para mudar a arrumação, mude a ordem deste arquivo.
#
# O que liga o livro ao texto é o campo `obras:` no cabeçalho de cada texto, que
# guarda o `slug` de uma obra daqui. Slug errado não dá erro de compilação: o
# texto simplesmente não aparece em lombada nenhuma.
#
# Campos: slug e titulo são obrigatórios; autor, ano e nota entram quando houver.
# `nota` é para o que não é do autor nem do ano: tradutor, médium, prefaciador.

